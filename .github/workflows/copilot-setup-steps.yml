name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .claude/**
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .claude/**

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify shared Claude links
        run: |
          test -n "$(git ls-tree -r HEAD .claude)"
          git ls-tree -r HEAD .claude | awk '$1 != "120000" { exit 1 }'
          test -z "$(find -L .claude -type l -print)"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.5.6"
          terraform_wrapper: false
      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
